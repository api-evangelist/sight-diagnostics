aid: sight-diagnostics
name: Sight Diagnostics
description: >-
  Sight Diagnostics is an Israeli medical-device and diagnostics company, founded in 2011 and
  headquartered in Tel Aviv, that built Sight OLO — an FDA 510(k)-cleared, CE-marked point-of-care
  hematology analyzer producing a 19-parameter, five-part-differential Complete Blood Count from two
  drops of capillary or venous blood in about ten minutes. OLO replaces reagent-based flow cytometry
  with digital microscopy and machine vision: it images the sample across five illumination channels
  (405nm, 517nm and 633nm brightfield plus 365nm and 460nm fluorescence) and classifies cells with
  computer-vision models rather than impedance or optical scatter. The company raised roughly $124M
  across six rounds and has more recently repositioned around live immune-cell analysis and "immune
  signatures". Sight Diagnostics is an instrument and clinical-workflow business, not a software
  platform: it publishes no public API, no developer portal, no SDKs and no machine-readable contract.
  Device connectivity to LIS/EMR systems is delivered as a customer integration engagement rather than
  as a documented public interface, so there is no developer surface to profile.
