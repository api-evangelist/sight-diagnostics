authorship: platform
authorship_note: >-
  CRITICAL READ-THIS-FIRST CAVEAT. This server is NOT authored by Sight Diagnostics. It is the
  generic Wix "Site Visitor Assistant" that the Wix platform auto-provisions at /_api/mcp for every
  tenant site, and it is advertised by the equally auto-generated /llms.txt. The tool set is
  byte-identical to every other Wix tenant: it exposes Wix's own REST documentation and a generic
  site-content search, and it carries no Sight Diagnostics domain semantics whatsoever — no OLO
  device, no CBC result, no hematology parameter, no order, no patient, no LIS/EMR concept appears
  anywhere in the manifest. Read this as "Sight Diagnostics runs its marketing site on Wix", not as
  "Sight Diagnostics ships an MCP server". Sight Diagnostics publishes no product API of any kind.

